name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 20 is deprecated on runners; 22 is the current LTS and matches
          # what the Worker and Pages builds are tested against locally.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Core is a build dependency of the apps; `pnpm typecheck` / `pnpm test`
      # at the root build it first, so the order cannot drift from this file.
      - name: Lint (Biome)
        run: pnpm lint

      # UI tells: the high-severity gate fails the build. Medium findings are
      # printed for visibility but do not fail it. Current medium count: 7 —
      # rounded-full on genuinely circular things (capture button, avatars,
      # status dot, switch thumb, slider thumbs). A rise means a new tell.
      - name: UI scanner (high-severity gate)
        run: python3 scripts/devibe_scan.py apps/miniapp/src --severity high

      - name: UI scanner (medium report)
        if: always()
        run: python3 scripts/devibe_scan.py apps/miniapp/src

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
