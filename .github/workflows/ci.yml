name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (saves minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Node 20 is deprecated on runners; 22 is the current LTS and matches
          # what the Worker and Pages builds are tested against locally.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Core is a build dependency of the apps; `pnpm typecheck` / `pnpm test`
      # at the root build it first, so the order cannot drift from this file.
      - name: Lint (Biome)
        run: pnpm lint

      # UI tells: emoji in shipped JSX strings and radii outside the role scale
      # fail the build. Tests are excluded because they quote old classes to
      # assert their absence.
      - name: UI tells
        run: pnpm lint:ui

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
