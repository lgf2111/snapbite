name = "snapbite-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Meal reminders: run every 15 minutes; the handler DMs users whose local time
# matches an enabled reminder slot (see src/reminders.ts, §15).
[triggers]
crons = ["*/15 * * * *"]

# D1 database binding.
# Cutover (§ rename): after `wrangler d1 create snapbite-db`, paste the new id
# into `database_id` below. Old foodlog-db id was f0312e67-2fef-47a6-a9ca-59cb9c21a79b
# (source for the one-time data export/import — see the cutover runbook in PLAN.md).
[[d1_databases]]
binding = "DB"
database_name = "snapbite-db"
database_id = "6c331800-c9a5-4c32-b5b4-17190c23dd6c"
migrations_dir = "migrations"

# Meal photo bytes (R2). Without this binding no photos are stored and the app
# falls back to Telegram's file_id proxy. Bucket: snapbite-photos.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "snapbite-photos"
