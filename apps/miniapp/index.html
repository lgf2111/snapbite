<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafe" media="(prefers-color-scheme: light)" />
    <title>SnapBite — snap a photo, log your meal</title>
    <meta
      name="description"
      content="SnapBite: snap a photo of your meal and get its calories and macros, with your own AI key. Everything is an editable estimate."
    />
    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SnapBite — snap a photo, log your meal" />
    <meta
      property="og:description"
      content="A lightweight calorie and macro logger. Snap a meal photo, get an editable estimate. Bring your own AI key."
    />
    <meta property="og:image" content="/icon.png" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Only what the page needs before the app mounts: no landing chrome, so
         there is nothing to flash and nothing to unstyle. */
      html, body { margin: 0; background: #080d16; }
      /* Follow the OS so the first paint matches the app's own tokens. */
      @media (prefers-color-scheme: light) { html, body { background: #f8fafe; } }
      #root { min-height: 100svh; }
    </style>
  </head>
  <body>
    <!--
      The app is the page. There is no marketing hero in front of it: a PWA that
      flashes a landing screen on every cold start reads as a website pretending
      to be an app, and the old hero's only action was "Open in Telegram", which
      is where this app no longer lives.
    -->
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui; padding: 24px; color: #1f1a16">
        SnapBite needs JavaScript. Open it in Safari or Chrome and turn on
        JavaScript in Settings.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
